name: Deploy Osmani TV Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Require SSH secret
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "Missing GitHub secret VPS_SSH_KEY — add the Contabo private key to deploy."
            exit 1
          fi
      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          HOST="${VPS_HOST:-144.91.117.90}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Publish to osmanitv.com
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_WEB_ROOT: ${{ secrets.VPS_WEB_ROOT }}
        run: |
          HOST="${VPS_HOST:-144.91.117.90}"
          USER="${VPS_USER:-root}"
          ROOT="${VPS_WEB_ROOT:-/var/www/osmanitv.com}"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$USER@$HOST" "mkdir -p '$ROOT'"
          scp -i ~/.ssh/vps_key -r web/dist/. "$USER@$HOST:$ROOT/"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes "$USER@$HOST" "nginx -t && (systemctl reload nginx || true)"
