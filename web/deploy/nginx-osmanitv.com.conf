# Example nginx server block for https://osmanitv.com
# Keep admin.osmanitv.com and api.osmanitv.com unchanged.

server {
    listen 80;
    listen [::]:80;
    server_name osmanitv.com www.osmanitv.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name osmanitv.com www.osmanitv.com;

    # ssl_certificate / etc paths already managed on VPS

    root /var/www/osmanitv.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
